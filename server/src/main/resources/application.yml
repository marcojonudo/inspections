micronaut:
    application:
        name: inspections
    server:
        cors:
            enabled: true
        port: 8095
    router:
        static-resources:
            default:
                mapping: /**
                paths: [classpath:static]
            swagger:
                paths: classpath:META-INF/swagger
                mapping: /swagger/**
            redoc:
                paths: classpath:META-INF/swagger/views/redoc
                mapping: /redoc/**
            rapidoc:
                paths: classpath:META-INF/swagger/views/rapidoc
                mapping: /rapidoc/**
            swagger-ui:
                paths: classpath:META-INF/swagger/views/swagger-ui
                mapping: /swagger-ui/**
            changelog:
                paths: classpath:changelog
                mapping: /changelog/**

endpoints:
    beans:
        enabled: true
        sensitive: false
    info:
        enabled: true
        sensitive: false
    health:
        enabled: true
        sensitive: false
    refresh:
        enabled: true
        sensitive: false
    routes:
        enabled: true
        sensitive: false
    loggers:
        enabled: true
        sensitive: false

slack:
    app:
        notifier:
            token: xoxb-531343073222-1104044199923-A6pTaIa10Heu7UFZQ8o0wGib
    channel:
        id:
            inspections: C013RLQTXNC

host:
    ip: ${HOST_IP:localhost}
    local-mysql-port: ${MYSQL_PORT:3306}

database:
    credentials:
        username: root
        password: root

hibernate:
    hbm2ddl:
        auto: 'none'

services:
    inspections-management:
        port: ${INSPECTIONS_MANAGEMENT_PORT:8096}
        url: http://localhost:${services.inspections-management.port}/realTime

dataSource:
    dbCreate: validate
    driverClassName: com.mysql.jdbc.Driver
    dialect: org.hibernate.dialect.MySQL5InnoDBDialect
    url: jdbc:mysql://${host.ip}:${host.local-mysql-port}/inspection?useSSL=false&serverTimezone=Europe/Madrid
    username: ${database.credentials.username}
    password: ${database.credentials.password}
    properties:
        initialSize: 1
        maxActive: 1
        minIdle: 1
        maxIdle: 1
        testOnBorrow: true
        validationQuery: SELECT 1
        validationInterval: 15000
#    logSql: true

