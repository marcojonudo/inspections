<mat-list>
	<mat-list-item matRipple>
		<mat-icon mat-list-icon>delete</mat-icon>
		<div mat-line>Reiniciar revisión (borrar todos los campos)</div>
	</mat-list-item>
	<mat-list-item matRipple (click)="goBack()">
		<mat-icon mat-list-icon>keyboard_backspace</mat-icon>
		<div mat-line>Volver a la pantalla principal</div>
	</mat-list-item>
	<mat-list-item>
		<mat-icon mat-list-icon>find_replace</mat-icon>
		<div mat-line>
			<mat-form-field>
				<mat-label>Introduce un nuevo código de orden</mat-label>
				<input matInput placeholder="C4" [(ngModel)]="orderCode">
				<button
					*ngIf="orderCode"
					mat-icon-button
					matSuffix
					(click)="searchOrder()"
					[disabled]="searchingInspections">
					<mat-icon *ngIf="!searchingInspections">search</mat-icon>
					<mat-spinner diameter="15" *ngIf="searchingInspections"></mat-spinner>
				</button>
			</mat-form-field>
		</div>
	</mat-list-item>
</mat-list>
