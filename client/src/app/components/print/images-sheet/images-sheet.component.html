<div *ngFor="let cat of categories" class="category">
	<mat-card *ngIf="cat.category; else elementTemplate">
		<mat-card-header>
			<mat-icon mat-card-avatar>navigate_next</mat-icon>
			<mat-card-title translate>print.category.{{cat.category.code}}</mat-card-title>
		</mat-card-header>
		<mat-card-content>
			<div class="image-category-content">
				<div *ngFor="let item of cat.items | printOrderPipe" class="image-item">
					<div translate>inspection.item.{{item.item.code}}</div>
					<div class="image-container">
						<img [src]="findImageUrl(item.imageId)">
					</div>
				</div>
			</div>
		</mat-card-content>
	</mat-card>
	<ng-template #elementTemplate>
		<mat-card>
			<mat-card-header>
				<mat-icon mat-card-avatar>navigate_next</mat-icon>
				<mat-card-title translate>inspection.item.{{cat.items[0].item.code}}</mat-card-title>
			</mat-card-header>
			<mat-card-content>
				<div class="image-category-content">
					<div class="image-item" [class.span]="findImage(cat.items[0].imageId)?.landscape">
						<img [src]="findImageUrl(cat.items[0].imageId)" class="item-image">
					</div>
				</div>
			</mat-card-content>
		</mat-card>
	</ng-template>
</div>
