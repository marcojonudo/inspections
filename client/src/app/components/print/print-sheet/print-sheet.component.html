<div class="sheet-container">
	<img src="assets/img/backgrounds/{{vehicleType.backgroundImage}}.jpg" class="vehicle-background-image"/>
	<div *ngFor="let cat of categories; let i = index" class="category">
		<div class="card" *ngIf="cat.category; else elementTemplate">
			<div class="card-header">
				<mat-icon mat-card-avatar>navigate_next</mat-icon>
				<div>{{cat.category.name}}</div>
			</div>
			<div class="card-content">
				<ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: cat }"></ng-container>
			</div>
		</div>
		<ng-template #elementTemplate>
			<div class="card text-area-card">
				<div class="card-header">
					<mat-icon mat-card-avatar>navigate_next</mat-icon>
					<div [innerHTML]="findItemName(cat.items[0].item)"></div>
				</div>
				<div class="card-content">
					<div *ngFor="let line of findTextAreaLines(cat.items[0])" class="highlight">{{line}}</div>
				</div>
			</div>
		</ng-template>
	</div>
	<ng-template #itemTemplate let-cat>
		<div class="items-info">
			<div *ngFor="let item of cat.items | printOrderPipe" class="item" [class.highlight]="checkWrongItem(item)">
				<div
					class="item-text"
					[class.text-item-fields]="checkMultipleFieldsItem(item)"
					[innerHTML]="findItemName(item.item)">
				</div>
				<mat-icon
					*ngIf="checkItemType(item.type, selectType); else textItemText"
					class="item-data"
					[style.color]="findIconColor(item.findValue())">
					{{findSelectIcon(item)}}
				</mat-icon>
				<ng-template #textItemText>
					<span class="item-text-value">{{item.isFilled() ? item.findValue() : '-'}}</span>
					<span class="item-unit">{{findTextItemUnit(item)}}</span>
				</ng-template>
			</div>
		</div>
	</ng-template>
</div>
