<div class="no-print">
	<h1 mat-dialog-title translate>dialog.header</h1>
	<div mat-dialog-content translate>
		resetEmployee.introduceEmployeeCode
		<mat-form-field>
			<mat-label translate>init.employeeCode</mat-label>
			<input
				matInput type="tel"
				placeholder="1234567"
				[(ngModel)]="newEmployeeCode"
				[maxLength]="findEmployeeCodeMaxLength()"
				(keyup)="searchEmployee()"
				autocomplete="off">
		</mat-form-field>
	</div>
</div>
