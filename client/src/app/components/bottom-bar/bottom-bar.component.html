<mat-toolbar class="mat-elevation-z3" color="primary">
	<section matRipple (click)="openEmployee()">
		<mat-icon>account_circle</mat-icon>
		<div>
			<span>{{employee?.code}}</span>
			<span>{{employee?.completeName}}</span>
		</div>
	</section>
	<section matRipple (click)="openOrder()">
		<mat-icon>assignment</mat-icon>
		<div>
			<span>{{order?.code}}</span>
			<span>{{order?.number}}</span>
		</div>
	</section>
	<button mat-icon-button (click)="openToolsMenu()">
		<mat-icon id="expand-menu-icon" [style.transform]="'rotate(' + (openedMenu ? '180deg' : 0) + ')'">expand_more</mat-icon>
	</button>
</mat-toolbar>
