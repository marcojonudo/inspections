<mat-toolbar class="mat-elevation-z3">
	<section matRipple (click)="openEmployee()">
		<mat-icon>account_circle</mat-icon>
		<div>
			<span>{{employee?.completeName}}</span>
		</div>
	</section>

	<div id="button-container">
		<button id="toggle-menu-button" mat-fab (click)="toggleMenu()">
			<mat-icon id="toggle-menu-icon" [class.opened-menu]="openedMenu">add</mat-icon>
		</button>
		<button
			mat-fab
			id="save-inspection-button"
			class="menu-button"
			[style.transform]="findMenuButtonTranslate(1)"
			(click)="saveInspection()">
			<mat-icon class="menu-button-icon" [class.straight]="openedMenu">save</mat-icon>
		</button>
		<button
			mat-fab
			id="print-inspection-button"
			class="menu-button"
			[style.transform]="findMenuButtonTranslate(2)"
			(click)="print()">
			<mat-icon class="menu-button-icon" [class.straight]="openedMenu">print</mat-icon>
		</button>
		<button
			mat-fab
			id="reset-inspection-button"
			class="menu-button"
			[style.transform]="findMenuButtonTranslate(3)"
			(click)="resetInspection()">
			<mat-icon class="menu-button-icon" [class.straight]="openedMenu">delete</mat-icon>
		</button>
	</div>
<!--	<button-->
<!--		id="save-inspection-button"-->
<!--		mat-fab-->
<!--		[style.bottom]="findSaveButtonBottom()"-->
<!--		(click)="saveInspection()"-->

<!--		<mat-icon *ngIf="!saving">save</mat-icon>-->
<!--		<mat-spinner diameter="30" *ngIf="saving"></mat-spinner>-->
<!--	</button>-->
	<section matRipple (click)="openOrder()">
		<mat-icon>assignment</mat-icon>
		<div>
			<span>{{order?.code}}</span>
			<span>·</span>
			<span>{{order?.number}}</span>
		</div>
	</section>
<!--	<button mat-icon-button (click)="openToolsMenu()">-->
<!--		<mat-icon id="expand-menu-icon" [style.transform]="'rotate(' + (openedMenu ? '180deg' : 0) + ')'">expand_more</mat-icon>-->
<!--	</button>-->
</mat-toolbar>
