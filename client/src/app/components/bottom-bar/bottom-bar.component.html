<div class="item">
	<i class="fas fa-user"></i>
	<div id="employee-info">
		<div>{{employee?.code}}</div>
		<div>{{employee?.completeName}}</div>

<div class="item" (click)="openOrder()">
	<i class="fas fa-clipboard"></i>
	<div id="order-info">
		<div>{{order?.code}}</div>
		<div>{{order?.number}}</div>
	</div>
</div>
