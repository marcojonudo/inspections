<mat-toolbar class="mat-elevation-z3">
	<section matRipple (click)="openEmployee()">
		<mat-icon>account_circle</mat-icon>
		<div>
			<span>{{employee?.completeName}}</span>
		</div>
	</section>
	<div id="button-container">
		<button id="toggle-menu-button" [class]="menuToggle" mat-fab (click)="toggleMenu()">
			<mat-icon id="toggle-menu-icon" [class]="menuToggle" [class.opened-menu]="openedMenu">add</mat-icon>
		</button>
		<button
			mat-fab
			id="save-inspection-button"
			class="menu-button"
			[class]="menuToggle"
			[style.transform]="findMenuButtonTranslate(1)"
			(click)="saveInspection()"
			[disabled]="saving">
			<mat-icon *ngIf="!saving" class="menu-button-icon" [class]="menuToggle" [class.straight]="openedMenu">save</mat-icon>
			<mat-spinner diameter="30" *ngIf="saving" [class]="menuToggle"></mat-spinner>
		</button>
		<button
			mat-fab
			id="print-inspection-button"
			class="menu-button"
			[class]="menuToggle"
			[style.transform]="findMenuButtonTranslate(2)"
			(click)="print()">
			<mat-icon class="menu-button-icon" [class]="menuToggle" [class.straight]="openedMenu">print</mat-icon>
		</button>
		<button
			mat-fab
			id="reset-inspection-button"
			class="menu-button"
			[class]="menuToggle"
			[style.transform]="findMenuButtonTranslate(3)"
			(click)="resetInspection()">
			<mat-icon class="menu-button-icon" [class]="menuToggle" [class.straight]="openedMenu">delete</mat-icon>
		</button>
	</div>
	<section matRipple (click)="openOrder()">
		<mat-icon>assignment</mat-icon>
		<div>
			<span>{{order?.code}}</span>
			<span>·</span>
			<span>{{order?.number}}</span>
		</div>
	</section>
</mat-toolbar>
