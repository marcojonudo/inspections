<mat-card (click)="setEmployeeFocus()">
	<mat-card-header class="custom-card-header">
		<mat-icon mat-card-avatar>account_circle</mat-icon>
		<mat-card-title translate>init.introduceEmployeeCode</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		<mat-form-field>
			<mat-label translate>init.employeeCode</mat-label>
			<input
				matInput
				[type]="findEmployeeCodeInputType()"
				#employeeCodeInput="matInput"
				[placeholder]="findEmployeeCodePlaceholder()"
				[formControl]="employeeCode"
				[maxLength]="employeeCodeMaxLength"
				(keyup)="searchEmployee()">
			<mat-error *ngIf="employeeCode.invalid">{{getEmployeeCodeErrorMessage() | async}}</mat-error>
		</mat-form-field>
	</mat-card-content>
</mat-card>
<mat-card class="hide" [class.show]="employee" (click)="setOrderCodeFocus()">
	<mat-card-header class="custom-card-header">
		<mat-icon mat-card-avatar>assignment</mat-icon>
		<mat-card-title translate>init.introduceShortCode</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		<mat-form-field>
			<mat-label translate>init.shortCode</mat-label>
			<input
				matInput
				#orderCodeInput="matInput"
				placeholder="C4"
				[formControl]="orderCode"
				(keydown.enter)="searchOrder()">
			<mat-error *ngIf="orderCode.invalid" translate>init.requiredShortCode</mat-error>
		</mat-form-field>
	</mat-card-content>
	<mat-card-actions>
		<button #searchOrderButton mat-fab [disabled]="checkDisableSearchOrderButton()">
			<mat-icon *ngIf="!searchingInspections">search</mat-icon>
			<mat-spinner diameter="30" *ngIf="searchingInspections"></mat-spinner>
		</button>
	</mat-card-actions>
</mat-card>
