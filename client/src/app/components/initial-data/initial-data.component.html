<mat-card>
	<mat-card-header class="custom-card-header">
		<mat-icon mat-card-avatar>account_circle</mat-icon>
		<mat-card-title>¿Cuál es tu código de empleado?</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		<mat-form-field>
			<mat-label>Código de empleado</mat-label>
			<input
				matInput
				placeholder="1234567"
				[formControl]="employeeCode"
				[maxLength]="employeeCodeLength"
				(keyup)="searchEmployee()">
			<mat-error *ngIf="employeeCode.invalid">{{getEmployeeCodeErrorMessage()}}</mat-error>
		</mat-form-field>
	</mat-card-content>
</mat-card>
<mat-card [@inOutTranslateAnimation] *ngIf="employee">
	<mat-card-header class="custom-card-header">
		<mat-icon mat-card-avatar>assignment</mat-icon>
		<mat-card-title>¿Cuál es el código corto de la orden?</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		<mat-form-field>
			<mat-label>Código corto</mat-label>
			<input
				matInput
				placeholder="C4"
				[formControl]="orderCode">
		</mat-form-field>
	</mat-card-content>
	<mat-card-actions>
		<button mat-fab (click)="searchOrder()" [disabled]="searchingInspections">
			<mat-icon *ngIf="!searchingInspections">search</mat-icon>
			<mat-spinner diameter="30" *ngIf="searchingInspections"></mat-spinner>
		</button>
	</mat-card-actions>
</mat-card>
