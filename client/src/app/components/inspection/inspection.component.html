<mat-toolbar id="inspection-title" class="mat-elevation-z3 no-print">
	<button id="back-icon-button" mat-icon-button (click)="goBack()">
		<mat-icon>chevron_left</mat-icon>
	</button>
	<h1 translate>inspection.type.{{inspection.code}}</h1>
	<button id="context-button" mat-icon-button [matMenuTriggerFor]="contextMenu" [class.pulse]="updateVersion">
		<span></span>
		<span></span>
		<span></span>
	</button>
	<mat-menu #contextMenu="matMenu" xPosition="before">
		<button mat-menu-item (click)="openChangelog()">
			<mat-icon>timeline</mat-icon>
			<span translate>inspection.changelog</span>
		</button>
		<button mat-menu-item *ngIf="updateVersion" (click)="refresh()">
			<mat-icon>upgrade</mat-icon>
			<span translate>inspection.updateVersion</span>
		</button>
		<div id="context-menu-version">
			{{version}}
			<span id="update-indicator" *ngIf="updateVersion"></span>
		</div>
	</mat-menu>
</mat-toolbar>
<div id="items-container" class="no-print">
	<ng-container
		*ngTemplateOutlet="recursiveList; context: {
        $implicit: listElements, index: 0
    }">
	</ng-container>
	<ng-template #recursiveList let-list let-index="index">
		<mat-accordion class="accordion">
			<mat-expansion-panel
				*ngFor="let category of findMenuCategories(list) | order"
				class="category"
				(opened)="addOpenedCategory(category.name)"
				(closed)="removeOpenedCategory(category.name)">
				<mat-expansion-panel-header class="category-title" [class.sub-category-title]="index > 0">
					<mat-panel-title translate>inspection.category.{{category.code}}</mat-panel-title>
					<button mat-icon-button class="category-title-button" (click)="completeCategory($event, category)">
						<mat-icon [class.rotated]="checkCompleteCategory(category)">pending</mat-icon>
						<mat-icon [class.rotated]="!checkCompleteCategory(category)">check_circle</mat-icon>
					</button>
				</mat-expansion-panel-header>
				<ng-container
					*ngTemplateOutlet="recursiveList; context: {
					$implicit: category.items, index: index + 1
				}">
				</ng-container>
			</mat-expansion-panel>
		</mat-accordion>
		<mat-list *ngIf="checkMenuItems(list)">
			<mat-list-item *ngFor="let item of findMenuItems(list) | order | hidden">
				<div
					*ngIf="checkItemType(item.type, selectType)"
					class="item select-item"
					matRipple
					(click)="toggleSelectOption(findSelectItem(item))"
					appLongPress
					[scrolled]="checkScrolledItem(item)"
					(pressingEmitter)="setPressingItem(item)"
					(longPressEmitter)="openLegend(findSelectItem(item))">
					<div class="select-item-content">
						<div translate>inspection.item.{{item.code}}</div>
						<div class="select-item-icon-container">
							<mat-icon
								*ngFor="let option of findSelectItem(item).options | order; let i = index"
								class="select-item-icon"
								[ngClass]="{
									'front': checkSelectedOption(item.name, option.name),
									'left': checkLeftOption(item.name, findSelectItem(item).options, i),
									'right': checkRightOption(item.name, findSelectItem(item).options, i)
								}"
								[style.color]="findIconColor(option.code)">
								{{option.icon}}
							</mat-icon>
						</div>
					</div>
				</div>
				<div *ngIf="checkItemType(item.type, textType)" class="item text-item">
					<mat-form-field class="text-item-input">
						<mat-label translate>inspection.item.{{item.code}}</mat-label>
						<input
							matInput
							type="tel"
							[placeholder]="findTextItem(item).placeholder"
							[(ngModel)]="findTextSavedItem(item.name).text"
							(change)="updateText(item)">
					</mat-form-field>
				</div>
				<div *ngIf="checkItemType(item.type, textAreaType)" class="item text-item">
					<mat-form-field appearance="standard" class="text-item-input">
						<mat-label translate>inspection.item.{{item.code}}</mat-label>
						<textarea
							matInput
							cdkTextareaAutosize
							cdkAutosizeMinRows="1"
							cdkAutosizeMaxRows="5"
							[(ngModel)]="findTextSavedItem(item.name).text"
							(change)="updateText(item)">
						</textarea>
					</mat-form-field>
				</div>
			</mat-list-item>
		</mat-list>
	</ng-template>
</div>
<div #toolBar class="no-print">
	<app-bottom-bar
		[employee]="employee"
		[openedMenu]="openedMenu"
		(foundInspectionEmitter)="updateGroupedItems()">
	</app-bottom-bar>
</div>
<router-outlet name="print"></router-outlet>
