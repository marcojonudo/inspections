<mat-toolbar id="inspection-title" class="mat-elevation-z3">
	<span>{{inspection.name}}</span>
</mat-toolbar>
<mat-list id="items-list">
	<div *ngFor="let items of groupedItems | keyvalue">
		<div mat-subheader>{{items.key}}</div>
		<div *ngFor="let item of items.value">
			<mat-list-item
				*ngIf="checkItemType(item.type, selectType)"
				class="select-item"
				matRipple
				(click)="toggleSelectOption(findSelectItem(item).options, findSelectItem(item))">
				<div class="select-item-content">
					<div>{{item.name}}</div>
					<div class="select-item-icon-container">
						<mat-icon
							*ngFor="let option of findSelectItem(item).options | order; let i = index"
							class="select-item-icon"
							[ngClass]="{
								'front': option.selected,
								'left': checkLeftOption(findSelectItem(item).options, i),
								'right': checkRightOption(findSelectItem(item).options, i)
							}">
							{{option.icon}}
						</mat-icon>
					</div>
				</div>
			</mat-list-item>
			<mat-list-item *ngIf="checkItemType(item.type, textType)" class="text-item">
				<mat-form-field class="text-item-input">
					<mat-label>{{item.name}}</mat-label>
					<input matInput>
				</mat-form-field>
			</mat-list-item>
		</div>
	</div>
<!--	<div mat-subheader>Folders</div>-->

<!--		<mat-icon mat-list-icon>folder</mat-icon>-->

</mat-list>
